<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Anime Catch Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #C1973E;
            --gold-gradient: linear-gradient(135deg, #C1973E, #e0b75c);
            --bg-dark: #0a0a0a;
            --card-dark: #1c1c1c;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
            margin: 0;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
        }

        .container {
            max-width: 480px;
            background: var(--card-dark);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(193, 151, 62, 0.15);
            border: 1px solid rgba(193, 151, 62, 0.2);
            position: relative;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gold-gradient);
        }

        .logo-circle {
            width: 75px;
            height: 75px;
            background: var(--gold-gradient);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(193, 151, 62, 0.4);
        }

        .logo-circle svg {
            width: 38px;
            height: 38px;
            fill: white;
            margin-left: 4px;
        }

        h1 {
            color: var(--text-light);
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #aaaaaa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .code-box {
            background-color: #2a2a2a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            word-wrap: break-word;
            font-size: 13px;
            color: #4da6ff;
            margin-bottom: 15px;
            user-select: all;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--gold-gradient);
            color: #ffffff;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(193, 151, 62, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(193, 151, 62, 0.6);
        }

        .btn-mal {
            background: #2E51A2;
            box-shadow: 0 4px 15px rgba(46, 81, 162, 0.4);
        }

        .btn-mal:hover {
            background: #3b66cb;
            box-shadow: 0 6px 20px rgba(46, 81, 162, 0.6);
        }

        .btn-secondary {
            background: #333;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #444;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            fill: currentColor;
        }
        
        .loading {
            display: none;
            margin-top: 15px;
            color: var(--primary-gold);
            font-weight: bold;
            font-size: 14px;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(193, 151, 62, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-gold);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #statusMessage {
            display: none;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-success {
            color: #4caf50;
        }

        .action-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(193, 151, 62, 0.1);
            border: 1px dashed rgba(193, 151, 62, 0.4);
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-circle">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        
        <h1 id="pageTitle">Anime Catch Authentication</h1>
        <p id="pageDesc">Connecting your account with Anime Catch...</p>
        
        <div class="code-box" id="authCode">Checking URL parameters...</div>

        <!-- أزرار النجاح (عند وصول الكود أو التوكن) -->
        <div id="foundActions" style="display: none;">
            <button id="copyCodeBtn" class="btn">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                Copy Code / Token (نسخ الكود)
            </button>
            
            <a href="#" id="deepLinkBtn" class="btn btn-secondary">
                <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                Open in App (فتح في التطبيق)
            </a>
        </div>

        <!-- زر تسجيل الدخول المباشر إذا فُتحت الصفحة بدون كود -->
        <div id="missingActions" class="action-box">
            <p style="margin-bottom: 12px; color: #e0b75c; font-weight: bold;">
                لم يتم العثور على كود في الرابط. اضغط على الزر أدناه لتسجيل الدخول في MyAnimeList أولاً:
            </p>
            <a id="malAuthDirectBtn" href="#" class="btn btn-mal">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                تسجيل الدخول في MyAnimeList
            </a>
        </div>

        <button id="copyUrlBtn" class="btn btn-secondary" style="margin-top: 8px;">
            <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
            Copy Full URL (نسخ الرابط بالكامل)
        </button>
        
        <div class="loading" id="loadingState">
            <div class="spinner"></div> جاري المزامنة التلقائية مع تطبيق الـ PC...
        </div>
        <div id="statusMessage"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const fullUrl = window.location.href;
            const search = window.location.search;
            const hash = window.location.hash;
            
            const urlParams = new URLSearchParams(search);
            const hashParams = new URLSearchParams(hash.startsWith('#') ? hash.substring(1) : hash);
            
            const pageTitle = document.getElementById('pageTitle');
            const pageDesc = document.getElementById('pageDesc');
            const authCodeBox = document.getElementById('authCode');
            const foundActions = document.getElementById('foundActions');
            const missingActions = document.getElementById('missingActions');
            const deepLinkBtn = document.getElementById('deepLinkBtn');
            const copyCodeBtn = document.getElementById('copyCodeBtn');
            const copyUrlBtn = document.getElementById('copyUrlBtn');
            const loadingState = document.getElementById('loadingState');
            const statusMessage = document.getElementById('statusMessage');
            const malAuthDirectBtn = document.getElementById('malAuthDirectBtn');

            // رابط تسجيل الدخول المباشر لـ MAL
            const malClientId = 'd376e06237e004b3f2099d7dc74813e1';
            const verifier = 'animecatch_verifier_token_example_1234567890';
            const malAuthLink = 'https://myanimelist.net/v1/oauth2/authorize?response_type=code&client_id=' + malClientId + '&code_challenge=' + verifier + '&state=RequestID123&redirect_uri=' + encodeURIComponent('https://anime4catch.github.io/AnimeCatch/callback');
            malAuthDirectBtn.href = malAuthLink;

            // 1. فحص وجود أخطاء
            const error = urlParams.get('error') || hashParams.get('error');
            const errorDesc = urlParams.get('error_description') || hashParams.get('error_description');
            if (error) {
                pageTitle.innerText = "Authentication Error";
                pageDesc.innerText = "Received an error from provider.";
                authCodeBox.innerText = "Error: " + error + (errorDesc ? "\nDescription: " + errorDesc : "");
                authCodeBox.style.color = "#ff4d4d";
                missingActions.style.display = 'block';
                return;
            }

            // 2. استخراج الـ code أو token بذكاء وبجميع الطرق الممكنة
            let code = urlParams.get('code') || hashParams.get('code');
            let token = hashParams.get('access_token') || urlParams.get('access_token') || urlParams.get('token') || hashParams.get('token');

            if (!code && fullUrl.includes('code=')) {
                const m = fullUrl.match(/[?&#]code=([^&#]+)/);
                if (m) code = decodeURIComponent(m[1]);
            }
            if (!token && fullUrl.includes('access_token=')) {
                const m = fullUrl.match(/[?&#]access_token=([^&#]+)/);
                if (m) token = decodeURIComponent(m[1]);
            }

            let valueToCopy = '';
            let paramKey = '';
            let paramValue = '';

            if (code) {
                pageTitle.innerText = "Authentication Code Received! 🎉";
                pageDesc.innerText = "تم استلام كود MyAnimeList بنجاح!";
                authCodeBox.innerText = code;
                valueToCopy = code;
                paramKey = 'code';
                paramValue = code;
                deepLinkBtn.href = "animecatch://login?code=" + encodeURIComponent(code);
                foundActions.style.display = 'block';
            } else if (token) {
                pageTitle.innerText = "Access Token Received! 🎉";
                pageDesc.innerText = "تم استلام توكن AniList بنجاح!";
                authCodeBox.innerText = token;
                valueToCopy = token;
                paramKey = 'token';
                paramValue = token;
                deepLinkBtn.href = "animecatch://login?token=" + encodeURIComponent(token);
                foundActions.style.display = 'block';
            } else {
                pageTitle.innerText = "No Code in URL";
                pageDesc.innerText = "لم يتم العثور على رمز تسجيل الدخول في هذا الرابط.";
                authCodeBox.innerText = "Current URL:\n" + fullUrl;
                authCodeBox.style.color = "#aaaaaa";
                missingActions.style.display = 'block';
            }

            // نسخ الكود
            copyCodeBtn.addEventListener('click', () => {
                if (!valueToCopy) return;
                navigator.clipboard.writeText(valueToCopy).then(() => {
                    copyCodeBtn.innerText = "✓ Copied! (تم النسخ)";
                    setTimeout(() => {
                        copyCodeBtn.innerText = "Copy Code / Token (نسخ الكود)";
                    }, 3000);
                });
            });

            // نسخ الرابط كاملاً
            copyUrlBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    copyUrlBtn.innerText = "✓ URL Copied! (تم نسخ الرابط)";
                    setTimeout(() => {
                        copyUrlBtn.innerText = "Copy Full URL (نسخ الرابط بالكامل)";
                    }, 3000);
                });
            });

            // مزامنة تلقائية مع تطبيق الويب وتطبيق الـ PC
            if (paramValue) {
                // 1. مزامنة الويب (Web App LocalStorage + Window Opener)
                try {
                    localStorage.setItem('animecatch_auth_' + paramKey, paramValue);
                    localStorage.setItem('animecatch_auth_latest', JSON.stringify({ key: paramKey, value: paramValue, time: Date.now() }));
                    if (window.opener) {
                        window.opener.postMessage({ type: 'animecatch_auth', key: paramKey, value: paramValue }, '*');
                    }
                } catch (e) {
                    console.error('LocalStorage sync error:', e);
                }

                // 2. مزامنة تطبيق الـ PC المحلي (Desktop Server)
                loadingState.style.display = 'block';
                const localUrl = "http://127.0.0.1:57342/auth?" + paramKey + "=" + encodeURIComponent(paramValue);
                
                fetch(localUrl, { method: 'GET', mode: 'no-cors' })
                    .then(() => {
                        loadingState.style.display = 'none';
                        statusMessage.style.display = 'block';
                        statusMessage.className = 'status-success';
                        statusMessage.innerText = "✓ تم استلام بيانات التوثيق بنجاح! يمكنك الآن العودة للتطبيق.";
                    })
                    .catch((err) => {
                        loadingState.style.display = 'none';
                        if (deepLinkBtn && deepLinkBtn.href && deepLinkBtn.href.startsWith('animecatch://')) {
                            window.location.href = deepLinkBtn.href;
                        }
                    });
            }
        });
    </script>
</body>
</html>
